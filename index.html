<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evergreen – Greens Management</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#0e2a1c;--forest2:#173d2a;--moss:#2f6b46;--sage:#bcd9b8;--bg:#e3e6e2;--card:#fff;--ink:#14231a;--mute:#5c6f62;--line:#dde6dc;--warn:#b7791f;--bad:#b4402f;--ok:#2f7d4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1a12;--card:#12281c;--ink:#e8f1ea;--mute:#94ab9b;--line:#21402e;--forest:#071810;--forest2:#10291c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--forest);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:700}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--forest);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-size:21px;font-weight:700}
.logo img{width:36px;height:36px;border-radius:9px;display:block}
.top small{margin-left:auto;color:var(--sage);font-size:12px;text-align:right}
aside{display:none}
main{padding:16px 16px 110px;max-width:980px;margin:0 auto}
nav.bar{position:fixed;bottom:0;left:0;right:0;background:var(--forest);display:flex;padding:8px 6px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
nav a,aside a{color:#b9cdbf;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav a.on,aside a.on{color:#fff;background:var(--forest2)}
nav svg,aside svg,.more svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.more{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end}
.more.open{display:flex}
.more div{background:var(--forest);width:100%;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.more a{display:flex;align-items:center;text-decoration:none;border-radius:10px;cursor:pointer;flex-direction:row;font-size:15px;padding:14px;gap:10px;justify-content:flex-start;background:var(--forest2);color:#fff}
@media(min-width:900px){
 aside{display:flex;flex-direction:column;gap:4px;position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;width:230px;background:var(--forest);padding:78px 12px 12px}
 aside a{flex-direction:row;font-size:15px;gap:12px;padding:11px 14px;flex:none}
 nav.bar{display:none}main{margin-left:230px;max-width:none;padding:24px 32px 48px}
 header.top{padding-left:24px}.wrap{max-width:980px}}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.page-h h1{font-size:26px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:17px;margin-bottom:10px}
.hero{background:var(--forest);color:#fff;border:0;border-radius:18px;padding:18px}
.hero h2{font-size:22px}.hero p{margin:4px 0 14px;color:var(--sage)}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi b{font:700 28px Fraunces,serif}.kpi span{color:var(--mute);font-size:13px}
.hero .kpi span{color:var(--sage)}.hero .kpi b{color:#fff}
.btn{border:0;border-radius:10px;padding:11px 14px;font:700 14px "DM Sans",sans-serif;cursor:pointer;background:var(--moss);color:#fff}
.btn.alt{background:transparent;color:inherit;border:1px solid var(--line)}
.btn.lite{background:var(--sage);color:var(--forest)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fbf8f;outline-offset:2px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.qa{grid-template-columns:repeat(4,1fr)}}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-of-type{border-top:0}.row small,.mute{color:var(--mute)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:#e1f1e3;color:#1f6b3a}
.badge.Fair{background:#fbefd5;color:#8a5a10}.badge.Attention{background:#f7dcd6;color:#933323}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{filter:brightness(.95)}}
.gcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit}
.gnum{font:700 34px Fraunces,serif;color:var(--moss);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 11px;font:500 13px "DM Sans";cursor:pointer}
.chip.on{background:var(--moss);color:#fff;border-color:var(--moss)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:18px}}
.tabs{display:flex;gap:6px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none}
.scroll{overflow-x:auto}
svg.ch{width:100%;height:auto;display:block}
.bar-r{display:grid;grid-template-columns:82px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar-r i{display:block;height:12px;border-radius:6px;background:var(--moss)}.bar-r i.dim{background:var(--sage)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;position:relative;cursor:pointer}
.cal button.sel{border:2px solid var(--moss)}.cal button.today{background:var(--sage);color:var(--forest)}
.cal button em{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--warn)}
.cal button em.d{background:var(--ok)}.cal .h{font-size:12px;color:var(--mute);padding:4px 0}
.gd{margin-bottom:10px;padding:0 14px}.gd summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;padding:12px 0;list-style:none}.gd summary::-webkit-details-marker{display:none}.gd[open] summary{border-bottom:1px solid var(--line)}
nav svg .ac,aside svg .ac,.more svg .ac{fill:#8fd16f;fill-opacity:.4;stroke:#8fd16f}nav a.on svg .ac,aside a.on svg .ac{fill-opacity:.85}
.hero .todo{display:flex;gap:10px;align-items:center;margin:0;padding:9px 0;font-size:14px;font-weight:400;border-top:1px solid rgba(255,255,255,.14)}.todo input{width:22px;height:22px;flex:none;accent-color:#8fd16f}.todo em{font-style:normal;color:#ffb9a8;font-size:12px}
.note{font-size:13px;background:#fbefd5;color:#6b4710;border-radius:10px;padding:10px;margin-top:12px}
</style></head><body>

<script>
/* ============ DATA LAYER ============
   Everything below talks to Store only. To add a real backend, replace
   Store.load/add/update/reset with API calls (e.g. fetch('/api/logs')).
   Data is stored in Supabase (see SB_URL below). */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const TODAY=ago(0);
const ACTS=["Mowing","Rolling","Verticutting","Topdressing","Aeration","Brushing","Irrigation","Other"];
const OPS=["J. Hartley","M. Okafor","S. Brennan","T. Lindqvist"];
const EQUIP={Mowing:"Toro Greensmaster 3150",Rolling:"Salsco Roller",Verticutting:"Graden Verticutter",Topdressing:"Dakota 410 Spreader",Aeration:"Toro ProCore 648",Brushing:"Turf Brush Unit",Irrigation:"Central Irrigation System",Other:"Hand tools"};
const PRODUCTS=[["Fertiliser","Greens Mix 14-4-14","25 g/m²"],["Fertiliser","Slow-release 20-0-10","20 g/m²"],["Fungicide","Chlorothalonil","1.5 L/ha"],["Wetting agent","Aqueduct","6 L/ha"],["Growth regulator","Primo Maxx","0.4 L/ha"],["Biostimulant","Seaweed + Iron","4 L/ha"]];
const SB_URL="https://zfrlnsfryyelinuzibyr.supabase.co",SB_KEY="sb_publishable_LZs1SGW45N_HD5MElsAX4g_KZJH-eiP";
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
const MAPS={logs:["maintenance_logs",{date:"log_date",green:"green_number",act:"activity",job:"job",equip:"equipment",op:"operator",notes:"notes"}],
 meas:["measurements",{date:"reading_date",green:"green_number",stimp:"stimp_ft",moist:"soil_moisture_pct",temp:"soil_temp_c",firm:"firmness",smooth:"smoothness",height:"grass_height_mm",cond:"condition_notes"}],
 treats:["treatments",{date:"treatment_date",green:"green_number",type:"treatment_type",product:"product",rate:"application_rate",qty:"quantity",cond:"conditions"}],
 tasks:["tasks",{date:"task_date",green:"green_number",act:"activity",job:"job",who:"assigned_to",done:"done"}]};
const fromDb=(k,r)=>{const o={id:r.id};for(const[l,d]of Object.entries(MAPS[k][1]))o[l]=r[d];return o};
const toDb=(k,o)=>{const r={};for(const[l,d]of Object.entries(MAPS[k][1]))if(l in o)r[d]=o[l]===""?null:o[l];return r};
const Store={
 s:{settings:{course:"My Golf Club",areaUnit:"m2",heightUnit:"mm"},greens:[],logs:[],meas:[],treats:[],tasks:[]},me:"",email:"",booted:null,
 async load(){try{Object.assign(this.s.settings,JSON.parse(localStorage.getItem("evg")||"{}"))}catch(e){}
  const keys=["logs","meas","treats","tasks"];
  const res=await Promise.all([sb.from("greens").select("*").order("number"),...keys.map(k=>sb.from(MAPS[k][0]).select("*").order("id",{ascending:false}).limit(1000))]);
  const bad=res.find(x=>x.error);if(bad)throw bad.error;
  this.s.greens=res[0].data.map(r=>({n:r.number,grass:r.grass_type,area:r.area_m2,cond:r.condition}));
  keys.forEach((k,i)=>this.s[k]=res[i+1].data.map(r=>fromDb(k,r)))},
 async addMany(k,recs){const{data,error}=await sb.from(MAPS[k][0]).insert(recs.map(r=>toDb(k,r))).select();if(error)throw error;data.forEach(r=>this.s[k].push(fromDb(k,r)))},
 async update(k,id,p){const{error}=await sb.from(MAPS[k][0]).update(toDb(k,p)).eq("id",id);if(error)throw error;Object.assign(this.s[k].find(x=>x.id==id),p)},
 async setCond(n,c){const{error}=await sb.from("greens").update({condition:c}).eq("number",n);if(error)throw error;this.s.greens.find(g=>g.n==n).cond=c},
 saveSettings(){try{localStorage.setItem("evg",JSON.stringify(this.s.settings))}catch(e){}}};

/* ============ HELPERS ============ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byDate=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
const fmtD=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const an=x=>x.act=="Other"&&x.job?"Other: "+x.job:x.act;
const gl=n=>n==="all"||n==0?"All greens":"Green "+n;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

/* ============ CHARTS (inline SVG, no libraries) ============ */
const COL=["#2f6b46","#c07a1a","#2f7fb5","#a03e7c","#6b8e23","#c0452f"];
function line(series,unit,range){const W=340,H=190,p={l:34,r:8,t:10,b:22};let all=series.flatMap(s=>s.pts.map(q=>q[1]));if(!all.length)return`<p class="mute">Select at least one green.</p>`;
 let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo||1)*.15;lo-=pad;hi+=pad;
 const x=d=>p.l+(1-d/range)*(W-p.l-p.r),y=v=>p.t+(1-(v-lo)/(hi-lo))*(H-p.t-p.b);
 let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mute)">${v.toFixed(1)}</text>`}
 g+=`<text x="${p.l}" y="${H-5}" font-size="10" fill="var(--mute)">${fmtD(ago(range))}</text><text x="${W-p.r}" y="${H-5}" font-size="10" text-anchor="end" fill="var(--mute)">Today</text>`;
 series.forEach((s,i)=>{const c=COL[i%6];g+=`<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.map(q=>x(q[0])+","+y(q[1])).join(" ")}"/>`+s.pts.map(q=>`<circle cx="${x(q[0])}" cy="${y(q[1])}" r="4" fill="${c}"><title>${s.name}: ${q[1]} ${unit} on ${fmtD(ago(q[0]))}</title></circle>`).join("")});
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="chips">${series.map((s,i)=>`<span class="mute" style="font-size:12px"><b style="color:${COL[i%6]}">●</b> ${s.name}</span>`).join(" ")}</div>`}
function bars(items,unit,hi=[]){const m=Math.max(...items.map(i=>i.v),1);return items.map(i=>`<div class="bar-r"><span>${esc(i.l)}</span><div><i class="${hi.length&&!hi.includes(i.k)?"dim":""}" style="width:${i.v/m*100}%"></i></div><b>${i.v}${unit}</b></div>`).join("")}

 <label>Current condition</label><select data-cond="${n}">${["Excellent","Good","Fair","Attention"].map(c=>`<option value="${c}"${c==g.cond?" selected":""}>${c=="Attention"?"Needs attention":c}</option>`).join("")}</select></div>
 <div class="tabs">${[["logs","Maintenance"],["meas","Measurements"],["treats","Treatments"]].map(([k,l])=>`<button class="chip ${t==k?"on":""}" data-gtab="${k}" data-g="${n}">${l}</button>`).join("")}</div><div class="card">${L.join("")||'<p class="mute">No history yet.</p>'}</div>`)}

function listSheet(k){const S=Store.s,rec=k=="recent",body=rec?[...S.logs].sort(byDate).slice(0,15).map(logRow):[...S.meas].sort(byDate).slice(0,12).map(m=>`<div class="row"><div><b>${gl(m.green)}</b><br><small>Stimp ${m.stimp} ft · ${m.moist}% moisture · ${m.temp}°C</small></div><small>${fmtD(m.date)}</small></div>`);
 openSheet(`<div class="page-h"><h2>${rec?"Recent activity":"Latest measurements"}</h2><button class="btn alt" data-act="close">Close</button></div><div class="card">${body.join("")}</div>`)}
document.addEventListener("toggle",e=>{const t=e.target,n=t.dataset.gk;if(t.tagName=="DETAILS"&&n)ST.openG=t.open?[...new Set([...ST.openG,n])]:ST.openG.filter(x=>x!=n)},true);
/* ============ APP ============ */
function render(){const r=NAV.some(n=>n[0]==route())?route():"dashboard";buildNav();$("#view").innerHTML=V[r]();$("#more").classList.remove("open");window.scrollTo(0,0)}
function rerender(){const y=scrollY;buildNav();$("#view").innerHTML=V[route()||"dashboard"]();scrollTo(0,y)}
addEventListener("hashchange",render);
document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-open],[data-green],[data-sel],[data-metric],[data-day],[data-mo],[data-gtab],[data-view]");
 if(e.target.id=="more"||e.target.id=="sheet"){closeSheet();$("#more").classList.remove("open");return}
 if(!t)return;const d=t.dataset;
 if(d.act=="more")$("#more").classList.add("open");
 else if(d.act=="close")closeSheet();
 else if(d.act=="signout"){Store.booted=null;sb.auth.signOut()}
 else if(d.open){openForm(d.open,{...(d.date?{date:d.date}:{}),...(d.gsel?{green:d.gsel}:{})})}
 else if(d.view){listSheet(d.view)}
 else if(d.green){ST.gTab="logs";greenSheet(+d.green)}
 else if(d.gtab){ST.gTab=d.gtab;greenSheet(+d.g)}
 else if(d.sel){const n=+d.sel;ST.sel=ST.sel.includes(n)?ST.sel.filter(x=>x!=n):[...ST.sel,n].slice(-6);rerender()}
 else if(d.metric){ST.metric=d.metric;rerender()}
 else if(d.day){ST.dayPick=d.day;rerender()}
 else if(d.mo){ST.month=new Date(ST.month.getFullYear(),ST.month.getMonth()+ +d.mo,1);rerender()}});
document.addEventListener("submit",e=>{if(e.target.dataset.form){e.preventDefault();submitForm(e.target)}});
document.addEventListener("change",e=>{const t=e.target,s=Store.s.settings;
 if(t.dataset.task){Store.update("tasks",t.dataset.task,{done:t.checked}).then(rerender).catch(er=>{toast("Could not save: "+er.message);rerender()})}
 else if(t.dataset.cond){Store.setCond(+t.dataset.cond,t.value).then(()=>{toast("Condition updated");rerender()}).catch(er=>toast("Could not save: "+er.message))}
 else if(t.id=="range"){ST.range=+t.value;rerender()}
 else if(t.id=="cname"){s.course=t.value;Store.saveSettings();buildNav()}
 else if(t.id=="au"){s.areaUnit=t.value;Store.saveSettings()}else if(t.id=="hu"){s.heightUnit=t.value;Store.saveSettings()}
 else if(t.name=="act"){const w=$("#jobw");if(w){w.hidden=t.value!="Other";w.querySelector("input").required=!w.hidden}}});
document.addEventListener("input",e=>{if(e.target.id=="q"){ST.q=e.target.value;const p=e.target.selectionStart;rerender();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeSheet();if((e.key=="Enter"||e.key==" ")&&e.target.dataset.act=="more"){e.preventDefault();$("#more").classList.add("open")}});
const showAuth=m=>{$("#authErr").textContent=m||"";$("#auth").classList.add("open")};
async function boot(session){if(Store.booted==session.user.id)return;Store.email=session.user.email;Store.me=session.user.email.split("@")[0];
 try{await Store.load();Store.booted=session.user.id;$("#auth").classList.remove("open");render()}catch(e){showAuth("Could not load data: "+e.message)}}
if(!sb)showAuth("Could not load the sign-in service. Check your internet connection and reload.");
else{$("#loginF").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);$("#authErr").textContent="";
  const{error}=await sb.auth.signInWithPassword({email:f.get("email").trim(),password:f.get("password")});if(error)$("#authErr").textContent=error.message});
 sb.auth.onAuthStateChange((ev,session)=>{if(session)boot(session);else{Store.booted=null;showAuth("")}})}
</script></body></html>
